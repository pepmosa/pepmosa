<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEPMOSA • Group Buy</title>

<link rel="stylesheet" href="style.css">

<style>
/* =========================================================
   PEPMOSA HOMEPAGE OVERRIDES
   ========================================================= */

.hero {
  display: grid !important;
  grid-template-columns: 48% 52% !important;
  align-items: center !important;
  gap: 0 !important;
  min-height: 360px !important;
}

/* LARGE CENTER / HERO LOGO */
.heroLogo {
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  width: 100% !important;
  height: 100% !important;
  min-height: 320px !important;
  padding: 20px !important;
  overflow: hidden !important;
  box-sizing: border-box !important;
}

.heroLogo img {
  display: block !important;
  width: 100% !important;
  max-width: 560px !important;
  height: auto !important;
  max-height: 330px !important;
  object-fit: contain !important;
}

/* HEADER LOGO */
.brand {
  display: flex !important;
  align-items: center !important;
  text-decoration: none !important;
  gap: 8px !important;
}

.brand .logoMark {
  display: none !important;
}

.brandLogo {
  display: block !important;
  width: 145px !important;
  height: 48px !important;
  object-fit: contain !important;
  object-position: left center !important;
}

/* keep header clean */
header {
  display: flex !important;
  align-items: center !important;
}

/* Mobile */
@media (max-width: 760px) {

  .hero {
    grid-template-columns: 1fr !important;
    min-height: auto !important;
  }

  .heroLogo {
    min-height: 260px !important;
    padding: 25px !important;
  }

  .heroLogo img {
    max-width: 430px !important;
    max-height: 260px !important;
  }

  .brandLogo {
    width: 120px !important;
    height: 42px !important;
  }
}
</style>
</head>

<body>

<!-- =========================================================
     HEADER
     ========================================================= -->

<header>

  <a class="brand" href="index.html">
    <img
      class="brandLogo"
      src="pepmosa-logo.png"
      alt="PEPMOSA"
    >
  </a>

  <nav class="nav">
    <a href="index.html">HOME</a>
    <a href="#products">PRODUCTS</a>
    <a href="calculator.html">CALCULATOR</a>
    <a href="protocols.html">PROTOCOLS</a>
    <a href="track.html">TRACK</a>
    <a href="coa.html">COA</a>
  </nav>

  <button class="cart" onclick="openCart()">
    🛒 CART (<span id="cartCount">0</span>)
  </button>

</header>


<!-- =========================================================
     MAIN
     ========================================================= -->

<main class="wrap">

  <!-- HERO -->
  <section class="hero">

    <!-- LARGE PEPMOSA NO-NAME LOGO -->
    <div class="heroLogo">
      <img
        src="pepmosa-no-name.png"
        alt="PEPMOSA"
      >
    </div>


    <!-- GROUP BUY INFORMATION -->
    <div class="gbPanel">

      <div class="eyebrow">
        GROUP BUY
      </div>

      <h1>
        SHOP <span>PEPMOSA</span>
      </h1>

      <p class="muted">
        Products available here are controlled by the categories opened
        for the current Group Buy.
      </p>

      <div id="gbStatus" class="notice">
        Loading current Group Buy…
      </div>

    </div>

  </section>


  <!-- =======================================================
       PRODUCTS
       ======================================================= -->

  <section id="products">

    <div class="sectionHead">

      <div>
        <div class="eyebrow">
          AVAILABLE NOW
        </div>

        <h2>
          PRODUCTS
        </h2>
      </div>

      <input
        id="search"
        class="search"
        placeholder="Search products…"
        oninput="renderProducts()"
      >

    </div>


    <div id="productGrid" class="grid">

      <div class="card">
        Loading…
      </div>

    </div>

  </section>


  <div class="footer">
    PEPMOSA • Group Buy
  </div>

</main>


<!-- =========================================================
     CART MODAL
     ========================================================= -->

<div id="cartModal" class="modal">

  <div class="modalbox">

    <div class="sectionHead">

      <h2>
        Your Cart
      </h2>

      <button
        class="btn secondary"
        onclick="closeModal('cartModal')"
      >
        CLOSE
      </button>

    </div>


    <div id="cartItems"></div>


    <div class="row">

      <b>
        TOTAL
      </b>

      <b id="cartTotal">
        ₱0.00
      </b>

    </div>


    <div class="actions">

      <button
        class="btn primary wide"
        onclick="checkout()"
      >
        CHECKOUT
      </button>

    </div>

  </div>

</div>


<!-- =========================================================
     CHECKOUT MODAL
     ========================================================= -->

<div id="checkoutModal" class="modal">

  <div class="modalbox">

    <h2>
      Checkout
    </h2>

    <div
      id="checkoutMsg"
      class="muted"
    ></div>


    <div class="formGrid">

      <div class="field">

        <label>
          Email
        </label>

        <input
          id="email"
          type="email"
          required
        >

      </div>


      <div class="field">

        <label>
          Customer Name
        </label>

        <input
          id="customerName"
        >

      </div>


      <div class="field">

        <label>
          Contact
        </label>

        <input
          id="contact"
        >

      </div>


      <div class="field">

        <label>
          Shipping Method
        </label>

        <input
          id="shippingMethod"
          placeholder="e.g. J&T"
        >

      </div>


      <div class="field full">

        <label>
          Delivery Address
        </label>

        <textarea id="address"></textarea>

      </div>

    </div>


    <div class="actions">

      <button
        class="btn primary"
        onclick="placeOrder()"
      >
        SUBMIT ORDER
      </button>

      <button
        class="btn secondary"
        onclick="closeModal('checkoutModal')"
      >
        CANCEL
      </button>

    </div>

  </div>

</div>


<!-- =========================================================
     SCRIPTS
     ========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="supabase.js"></script>


<script>

let currentGB = null;
let products = [];

let cart = JSON.parse(
  localStorage.pepmosaCart || "[]"
);


/* =========================================================
   INITIALIZE SUPABASE
   ========================================================= */

initSupabase();


/* =========================================================
   LOAD GROUP BUY + PRODUCTS
   ========================================================= */

async function load() {

  try {

    const {
      data: gb,
      error: gbError
    } = await sb
      .from("group_buys")
      .select("*")
      .eq("status", "OPEN")
      .order("created_at", {
        ascending: false
      })
      .limit(1)
      .maybeSingle();


    if (gbError) {
      throw gbError;
    }


    currentGB = gb;


    /* NO OPEN GB */

    if (!gb) {

      $("gbStatus").innerHTML =
        '<div class="notice error">' +
        'No open Group Buy right now.' +
        '</div>';

      renderEmptyProducts();

      return;
    }


    /* OPEN GB */

    $("gbStatus").innerHTML =
      '<b>' +
      esc(
        gb.customer_facing_name ||
        gb.gb_number
      ) +
      '</b> ' +
      '<span class="status open">OPEN</span>';


    /* =====================================================
       GET CATEGORIES OPENED FOR THIS GB
       ===================================================== */

    const {
      data: cats,
      error: catError
    } = await sb
      .from("gb_categories")
      .select("category_name")
      .eq(
        "gb_number",
        gb.gb_number
      );


    if (catError) {
      throw catError;
    }


    const names = (cats || [])
      .map(x => x.category_name)
      .filter(Boolean);


    /* =====================================================
       GET ACTIVE PRODUCTS + VARIANTS
       ===================================================== */

    let q = sb
      .from("products")
      .select(
        "*,product_variants(*)"
      )
      .eq(
        "active",
        true
      )
      .order(
        "product_name"
      );


    /*
      ONLY SHOW PRODUCTS BELONGING
      TO CATEGORIES OPENED IN CURRENT GB
    */

    if (names.length) {

      q = q.in(
        "category",
        names
      );

    } else {

      /*
        If GB has no categories,
        show no products.
      */

      products = [];

      renderEmptyProducts();

      return;
    }


    const {
      data,
      error
    } = await q;


    if (error) {
      throw error;
    }


    products = data || [];


    /* =====================================================
       GET MINIMUM QUANTITIES
       ===================================================== */

    const {
      data: mins,
      error: minError
    } = await sb
      .from("gb_minimum_quantities")
      .select("*")
      .eq(
        "gb_number",
        gb.gb_number
      );


    if (minError) {
      throw minError;
    }


    /*
      APPLY INDIVIDUAL MINIMUM
      PER PRODUCT / VARIANT
    */

    for (
      const p of products
    ) {

      for (
        const v of (
          p.product_variants || []
        )
      ) {

        const found =
          (mins || []).find(
            m =>
              m.variant_id ===
              v.variant_id
          );


        v.minimum_qty =
          Math.max(
            1,
            Number(
              found?.minimum_qty || 1
            )
          );

      }

    }


    renderProducts();

    updateCart();

  } catch (e) {

    $("gbStatus").className =
      "notice error";

    $("gbStatus").textContent =
      e.message;

  }

}


/* =========================================================
   EMPTY PRODUCTS
   ========================================================= */

function renderEmptyProducts() {

  $("productGrid").innerHTML = `
    <div class="card" style="
      grid-column:1/-1;
      text-align:center;
      padding:50px;
    ">
      <div style="font-size:42px;">
        🛍️
      </div>

      <h3>
        No products available yet.
      </h3>

      <p class="muted">
        There is no open Group Buy at the moment.
      </p>
    </div>
  `;

}


/* =========================================================
   GET ELEMENT
   ========================================================= */

function $(id) {

  return document.getElementById(id);

}


/* =========================================================
   RENDER PRODUCTS
   ========================================================= */

function renderProducts() {

  const q =
    $("search").value
      .toLowerCase()
      .trim();


  const arr =
    products.filter(
      p =>
        (
          p.product_name +
          " " +
          (p.description || "") +
          " " +
          (p.category || "")
        )
        .toLowerCase()
        .includes(q)
    );


  if (!arr.length) {

    $("productGrid").innerHTML = `
      <div class="card">
        No products found.
      </div>
    `;

    return;
  }


  $("productGrid").innerHTML =

    arr.map(
      p => `

      <article class="card">

        <div class="productImg">

          ${
            p.image_url

            ? `<img
                src="${esc(p.image_url)}"
                alt="${esc(p.product_name)}"
              >`

            : esc(p.product_name)
          }

        </div>


        <div class="eyebrow">
          ${esc(p.category || "")}
        </div>


        <h3>
          ${esc(p.product_name)}
        </h3>


        <p class="muted">
          ${esc(p.description || "")}
        </p>


        ${
          (p.product_variants || [])
            .filter(v => v.active)
            .map(
              v => `

              <div class="variant">

                <span style="min-width:100px">

                  <b>
                    ${esc(v.strength)}
                  </b>

                  <br>

                  <small>
                    ${peso(v.price)}
                  </small>

                </span>


                <input
                  class="qty"
                  type="number"
                  min="${v.minimum_qty}"
                  value="${v.minimum_qty}"
                  id="qty-${v.variant_id}"
                >


                <button
                  class="btn primary"
                  onclick="addToCart(
                    '${esc(p.product_id)}',
                    '${esc(v.variant_id)}'
                  )"
                >
                  ADD
                </button>

              </div>


              <div class="minBadge">
                Minimum:
                ${v.minimum_qty}
                pc
              </div>

              `
            )
            .join("")
        }

      </article>

      `
    )
    .join("");

}


/* =========================================================
   ADD TO CART
   ========================================================= */

function addToCart(
  pid,
  vid
) {

  const p =
    products.find(
      x =>
        x.product_id === pid
    );


  if (!p) {
    return;
  }


  const v =
    (p.product_variants || [])
      .find(
        x =>
          x.variant_id === vid
      );


  if (!v) {
    return;
  }


  const qtyInput =
    $("qty-" + vid);


  const requested =
    Number(
      qtyInput?.value ||
      v.minimum_qty
    );


  const qty =
    Math.max(
      v.minimum_qty,
      requested
    );


  const existing =
    cart.find(
      x =>
        x.variant_id === vid
    );


  if (existing) {

    existing.qty += qty;

  } else {

    cart.push({

      product_id:
        pid,

      variant_id:
        vid,

      product_name:
        p.product_name,

      strength:
        v.strength,

      price:
        Number(v.price),

      qty:
        qty

    });

  }


  localStorage.pepmosaCart =
    JSON.stringify(cart);


  updateCart();

  openCart();

}


/* =========================================================
   UPDATE CART COUNT
   ========================================================= */

function updateCart() {

  $("cartCount").textContent =
    cart.reduce(
      (s, x) =>
        s + Number(x.qty),
      0
    );

}


/* =========================================================
   OPEN CART
   ========================================================= */

function openCart() {

  $("cartModal")
    .classList
    .add("show");


  $("cartItems").innerHTML =

    cart.length

    ? cart.map(
        (x, i) => `

        <div class="row">

          <span>
            ${esc(x.product_name)}
            —
            ${esc(x.strength)}
            ×
            ${x.qty}
          </span>


          <b>

            ${peso(
              x.price *
              x.qty
            )}

            <button
              class="btn secondary"
              onclick="removeCart(${i})"
            >
              ×
            </button>

          </b>

        </div>

        `
      ).join("")

    : `
      <p class="muted">
        Cart is empty.
      </p>
    `;


  $("cartTotal").textContent =
    peso(
      cart.reduce(
        (s, x) =>
          s +
          x.price *
          x.qty,
        0
      )
    );

}


/* =========================================================
   REMOVE CART ITEM
   ========================================================= */

function removeCart(i) {

  cart.splice(
    i,
    1
  );


  localStorage.pepmosaCart =
    JSON.stringify(cart);


  updateCart();

  openCart();

}


/* =========================================================
   CLOSE MODAL
   ========================================================= */

function closeModal(id) {

  $(id)
    .classList
    .remove("show");

}


/* =========================================================
   CHECKOUT
   ========================================================= */

function checkout() {

  if (!cart.length) {

    alert(
      "Cart is empty."
    );

    return;
  }


  closeModal(
    "cartModal"
  );


  $("checkoutModal")
    .classList
    .add("show");

}


/* =========================================================
   PLACE ORDER
   ========================================================= */

async function placeOrder() {

  try {

    if (!currentGB) {

      alert(
        "No open Group Buy."
      );

      return;
    }


    const email =
      $("email")
        .value
        .trim()
        .toLowerCase();


    if (!email) {

      alert(
        "Enter email."
      );

      return;
    }


    /* =====================================================
       CUSTOMER
       ===================================================== */

    const {
      data: customer,
      error: ce
    } = await sb
      .from("customers")
      .upsert(

        {
          email,

          customer_name:
            $("customerName")
              .value
              .trim(),

          contact:
            $("contact")
              .value
              .trim(),

          address:
            $("address")
              .value
              .trim()

        },

        {
          onConflict:
            "email"
        }

      )
      .select()
      .single();


    if (ce) {
      throw ce;
    }


    /* =====================================================
       TOTAL
       ===================================================== */

    const total =
      cart.reduce(
        (s, x) =>
          s +
          x.price *
          x.qty,
        0
      );


    /* =====================================================
       ORDER
       ===================================================== */

    const {
      data: o,
      error: oe
    } = await sb
      .from("orders")
      .insert({

        gb_number:
          currentGB.gb_number,

        customer_id:
          customer.customer_id,

        email,

        total,

        payment_status:
          "PENDING",

        shipping_method:
          $("shippingMethod")
            .value
            .trim(),

        shipping_fee:
          0

      })
      .select()
      .single();


    if (oe) {
      throw oe;
    }


    /* =====================================================
       ORDER ITEMS
       ===================================================== */

    const rows =
      cart.map(
        x => ({

          order_id:
            o.order_id,

          product_id:
            x.product_id,

          variant_id:
            x.variant_id,

          product_name:
            x.product_name,

          strength:
            x.strength,

          qty:
            x.qty,

          unit_price:
            x.price,

          line_total:
            x.price *
            x.qty

        })
      );


    const {
      error: ie
    } = await sb
      .from("order_items")
      .insert(rows);


    if (ie) {
      throw ie;
    }


    /* =====================================================
       SUCCESS
       ===================================================== */

    $("checkoutMsg").className =
      "notice success";


    $("checkoutMsg").textContent =
      "Order submitted: " +
      o.order_id +
      ". Please follow the payment instructions from PEPMOSA.";


    cart = [];

    localStorage.removeItem(
      "pepmosaCart"
    );


    updateCart();


  } catch (e) {

    $("checkoutMsg").className =
      "notice error";

    $("checkoutMsg").textContent =
      e.message;

  }

}


/* =========================================================
   HELPERS
   ========================================================= */

function esc(value) {

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function peso(value) {

  return "₱" +
    Number(
      value || 0
    ).toLocaleString(
      "en-PH",
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    );

}


/* =========================================================
   START
   ========================================================= */

load();

</script>

</body>
</html>
