<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEPMOSA • Group Buy</title>
<link rel="stylesheet" href="style.css">
<style>
.hero{
  grid-template-columns:minmax(280px,1fr) minmax(320px,1.25fr);
  min-height:360px;
}
.heroLogo{
  min-height:300px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:clamp(42px,6vw,78px);
  letter-spacing:2px;
}
.heroLogo img{
  max-width:100%;
  max-height:280px;
  object-fit:contain;
}
.gbPanel{
  display:grid;
  gap:10px;
}
.gbInfo{
  background:#fff;
  border:1px solid #efd9e5;
  border-radius:18px;
  padding:14px;
}
.gbInfo strong{display:block;margin-bottom:4px}
.productEmpty{
  grid-column:1/-1;
  text-align:center;
  padding:40px 20px;
}
.productEmpty .emptyIcon{font-size:42px;margin-bottom:8px}
.productCardTop{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}
.categoryBadge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  background:#fff0f7;
  color:#9b4672;
  font-size:10px;
  font-weight:900;
  margin-top:4px;
}
.variantRow{
  display:grid;
  grid-template-columns:minmax(70px,1fr) 82px auto;
  gap:8px;
  align-items:center;
  margin-top:10px;
}
.qtyControl{
  display:flex;
  align-items:center;
  gap:4px;
}
.qtyControl button{
  width:30px;height:34px;border:1px solid #ead4df;background:#fff;border-radius:9px;cursor:pointer;font-weight:900;
}
.qtyControl input{
  width:48px!important;text-align:center;padding:8px 4px!important;
}
@media(max-width:800px){
  .hero{grid-template-columns:1fr}
  .heroLogo{min-height:220px}
}
@media(max-width:560px){
  .variantRow{grid-template-columns:1fr}
}
</style>
</head><style>
.heroLogo {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 220px;
  overflow: hidden;
}

.heroLogo img {
  display: block;
  width: 85%;
  max-width: 360px;
  max-height: 210px;
  height: auto;
  object-fit: contain;
}
</style>
<body>

<header>
  <a class="brand" href="index.html"><span class="logoMark">P</span>PEPMOSA</a>
  <nav class="nav">
    <a href="index.html">HOME</a>
    <a href="#products">PRODUCTS</a>
    <a href="calculator.html">CALCULATOR</a>
    <a href="protocols.html">PROTOCOLS</a>
    <a href="track.html">TRACK</a>
    <a href="coa.html">COA</a>
  </nav>
  <button class="cart" onclick="openCart()">🛒 CART (<span id="cartCount">0</span>)</button>
</header>

<main class="wrap">

<section class="hero">
  <div class="heroLogo">
  <img src="pepmosa-logo.png" alt="PEPMOSA Logo">
</div>

  <div class="gbPanel">
    <div>
      <div class="eyebrow">GROUP BUY</div>
      <h1>SHOP <span>PEPMOSA</span></h1>
      <p class="muted">Products available here are controlled by the categories opened for the current Group Buy.</p>
    </div>

    <div id="gbStatus" class="notice">Loading current Group Buy…</div>

    <div id="gbDetails" style="display:none">
      <div class="gbInfo">
        <strong id="gbName"></strong>
        <span class="muted" id="gbNumber"></span>
      </div>
    </div>
  </div>
</section>

<section id="products">
  <div class="sectionHead">
    <div>
      <div class="eyebrow">AVAILABLE NOW</div>
      <h2>PRODUCTS</h2>
    </div>
    <input id="search" class="search" placeholder="Search products…" oninput="renderProducts()">
  </div>

  <div id="productGrid" class="grid">
    <div class="card">Loading…</div>
  </div>
</section>

<div class="footer">PEPMOSA • Group Buy</div>
</main>

<!-- CART -->
<div id="cartModal" class="modal">
  <div class="modalbox">
    <div class="sectionHead">
      <h2>Your Cart</h2>
      <button class="btn secondary" onclick="closeModal('cartModal')">CLOSE</button>
    </div>

    <div id="cartItems"></div>

    <div class="row">
      <b>TOTAL</b>
      <b id="cartTotal">₱0.00</b>
    </div>

    <div class="actions">
      <button class="btn primary wide" onclick="checkout()">CHECKOUT</button>
    </div>
  </div>
</div>

<!-- CHECKOUT -->
<div id="checkoutModal" class="modal">
  <div class="modalbox">
    <h2>Checkout</h2>
    <div id="checkoutMsg" class="muted"></div>

    <div class="formGrid">
      <div class="field">
        <label>Email</label>
        <input id="email" type="email" required>
      </div>

      <div class="field">
        <label>Customer Name</label>
        <input id="customerName">
      </div>

      <div class="field">
        <label>Contact</label>
        <input id="contact">
      </div>

      <div class="field">
        <label>Shipping Method</label>
        <input id="shippingMethod" placeholder="e.g. J&T">
      </div>

      <div class="field full">
        <label>Delivery Address</label>
        <textarea id="address"></textarea>
      </div>
    </div>

    <div class="actions">
      <button class="btn primary" onclick="placeOrder()">SUBMIT ORDER</button>
      <button class="btn secondary" onclick="closeModal('checkoutModal')">CANCEL</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase.js"></script>

<script>
let currentGB = null;
let products = [];
let cart = JSON.parse(localStorage.getItem("pepmosaCart") || "[]");

function $(id){
  return document.getElementById(id);
}

function saveCart(){
  localStorage.setItem("pepmosaCart", JSON.stringify(cart));
}

function normalizeQty(value, minimum){
  let qty = Number(value);
  if(!Number.isFinite(qty)) qty = minimum;
  qty = Math.floor(qty);
  return Math.max(minimum, qty);
}

function getMinimum(variant){
  return Math.max(1, Number(variant.minimum_qty || 1));
}

function findVariant(variantId){
  for(const product of products){
    const variant = (product.product_variants || []).find(v => v.variant_id === variantId);
    if(variant) return {product, variant};
  }
  return null;
}

async function load(){
  try{
    initSupabase();

    const {data: gb, error: gbError} = await sb
      .from("group_buys")
      .select("*")
      .eq("status","OPEN")
      .order("created_at",{ascending:false})
      .limit(1)
      .maybeSingle();

    if(gbError) throw gbError;

    currentGB = gb;

    if(!gb){
      $("gbStatus").className = "notice error";
      $("gbStatus").textContent = "No open Group Buy right now.";
      $("productGrid").innerHTML =
        '<div class="card productEmpty"><div class="emptyIcon">🛍️</div><b>No products available yet.</b><p class="muted">There is no open Group Buy at the moment.</p></div>';
      return;
    }

    $("gbStatus").className = "notice success";
    $("gbStatus").innerHTML =
      '<b>' + esc(gb.customer_facing_name || gb.gb_number) +
      '</b> <span class="status open">OPEN</span>';

    $("gbName").textContent = gb.customer_facing_name || "Group Buy";
    $("gbNumber").textContent = gb.gb_number;
    $("gbDetails").style.display = "block";

    const {data: cats, error: catError} = await sb
      .from("gb_categories")
      .select("category_name")
      .eq("gb_number", gb.gb_number);

    if(catError) throw catError;

    const names = (cats || []).map(x => x.category_name);

    if(!names.length){
      products = [];
      $("productGrid").innerHTML =
        '<div class="card productEmpty"><div class="emptyIcon">🛍️</div><b>No categories are open for this Group Buy.</b><p class="muted">Please check back when the admin opens a category.</p></div>';
      return;
    }

    const {data: productData, error: productError} = await sb
      .from("products")
      .select("*,product_variants(*)")
      .eq("active",true)
      .in("category",names)
      .order("product_name");

    if(productError) throw productError;

    products = productData || [];

    const {data: mins, error: minError} = await sb
      .from("gb_minimum_quantities")
      .select("*")
      .eq("gb_number", gb.gb_number);

    if(minError) throw minError;

    for(const product of products){
      for(const variant of (product.product_variants || [])){
        const setting = (mins || []).find(
          m =>
            m.product_id === product.product_id &&
            m.variant_id === variant.variant_id
        );

        variant.minimum_qty = Math.max(
          1,
          Number(setting?.minimum_qty || 1)
        );
      }
    }

    renderProducts();
    updateCart();

  }catch(error){
    console.error(error);
    $("gbStatus").className = "notice error";
    $("gbStatus").textContent =
      "Unable to load the Group Buy: " + (error.message || error);

    $("productGrid").innerHTML =
      '<div class="card productEmpty"><b>Unable to load products.</b><p class="muted">Please refresh the page.</p></div>';
  }
}

function renderProducts(){
  const query = ($("search").value || "").toLowerCase().trim();

  const arr = products.filter(product =>
    (
      (product.product_name || "") + " " +
      (product.description || "") + " " +
      (product.category || "")
    ).toLowerCase().includes(query)
  );

  if(!arr.length){
    $("productGrid").innerHTML =
      '<div class="card productEmpty"><div class="emptyIcon">🛍️</div><b>No products found.</b><p class="muted">Try another search or check back later.</p></div>';
    return;
  }

  $("productGrid").innerHTML = arr.map(product => {

    const variants = (product.product_variants || []).filter(v => v.active);

    return `
      <article class="card">
        <div class="productImg">
          ${
            product.image_url
              ? '<img src="' + esc(product.image_url) + '" alt="' + esc(product.product_name) + '">'
              : esc(product.product_name)
          }
        </div>

        <div class="productCardTop">
          <div>
            <h3>${esc(product.product_name)}</h3>
            <span class="categoryBadge">${esc(product.category || "Product")}</span>
          </div>
        </div>

        <p class="muted">${esc(product.description || "")}</p>

        ${
          variants.length
            ? variants.map(variant => {
                const min = getMinimum(variant);

                return `
                  <div class="variantRow">
                    <div>
                      <b>${esc(variant.strength)}</b>
                      <br>
                      <small>${peso(variant.price)}</small>
                      <div class="minBadge">Minimum: ${min} pc</div>
                    </div>

                    <div class="qtyControl">
                      <button onclick="changeQty('${esc(variant.variant_id)}',-1)">−</button>
                      <input
                        class="qty"
                        id="qty-${esc(variant.variant_id)}"
                        type="number"
                        min="${min}"
                        value="${min}"
                      >
                      <button onclick="changeQty('${esc(variant.variant_id)}',1)">+</button>
                    </div>

                    <button
                      class="btn primary"
                      onclick="addToCart('${esc(product.product_id)}','${esc(variant.variant_id)}')">
                      ADD
                    </button>
                  </div>
                `;
              }).join("")
            : '<div class="notice">No active variants.</div>'
        }
      </article>
    `;
  }).join("");
}

function changeQty(variantId, delta){
  const found = findVariant(variantId);
  if(!found) return;

  const input = $("qty-" + variantId);
  if(!input) return;

  const min = getMinimum(found.variant);
  input.value = normalizeQty(Number(input.value || min) + delta, min);
}

function addToCart(productId, variantId){
  const product = products.find(p => p.product_id === productId);

  if(!product){
    alert("Product is no longer available.");
    return;
  }

  const variant = (product.product_variants || []).find(
    v => v.variant_id === variantId
  );

  if(!variant || !variant.active){
    alert("Variant is no longer available.");
    return;
  }

  const minimum = getMinimum(variant);
  const qtyInput = $("qty-" + variantId);

  const qty = normalizeQty(
    qtyInput ? qtyInput.value : minimum,
    minimum
  );

  if(qtyInput) qtyInput.value = qty;

  const existing = cart.find(
    item =>
      item.variant_id === variantId &&
      item.gb_number === currentGB.gb_number
  );

  if(existing){
    existing.qty += qty;

    if(existing.qty < minimum){
      existing.qty = minimum;
    }
  }else{
    cart.push({
      gb_number: currentGB.gb_number,
      product_id: productId,
      variant_id: variantId,
      product_name: product.product_name,
      strength: variant.strength,
      price: Number(variant.price),
      qty: qty,
      minimum_qty: minimum
    });
  }

  saveCart();
  updateCart();
  openCart();
}

function updateCart(){
  $("cartCount").textContent =
    cart.reduce((sum,item) => sum + Number(item.qty || 0), 0);
}

function openCart(){
  $("cartModal").classList.add("show");

  if(!cart.length){
    $("cartItems").innerHTML =
      '<p class="muted">Cart is empty.</p>';
  }else{
    $("cartItems").innerHTML = cart.map((item,index) => `
      <div class="row">
        <span>
          <b>${esc(item.product_name)}</b>
          — ${esc(item.strength)}
          × ${item.qty}
          <br>
          <small class="muted">Minimum ${item.minimum_qty || 1} pc</small>
        </span>

        <b>
          ${peso(item.price * item.qty)}
          <button class="btn secondary" onclick="removeCart(${index})">×</button>
        </b>
      </div>
    `).join("");
  }

  $("cartTotal").textContent =
    peso(cart.reduce(
      (sum,item) => sum + Number(item.price || 0) * Number(item.qty || 0),
      0
    ));
}

function removeCart(index){
  cart.splice(index,1);
  saveCart();
  updateCart();
  openCart();
}

function closeModal(id){
  $(id).classList.remove("show");
}

function checkout(){
  if(!cart.length){
    alert("Cart is empty.");
    return;
  }

  closeModal("cartModal");
  $("checkoutModal").classList.add("show");
}

async function placeOrder(){
  try{
    if(!currentGB){
      alert("No open Group Buy.");
      return;
    }

    if(!cart.length){
      alert("Cart is empty.");
      return;
    }

    // Re-check current minimums immediately before order creation.
    const {data: latestMinimums, error: latestMinimumError} = await sb
      .from("gb_minimum_quantities")
      .select("*")
      .eq("gb_number", currentGB.gb_number);

    if(latestMinimumError) throw latestMinimumError;

    for(const item of cart){
      const setting = (latestMinimums || []).find(
        m =>
          m.product_id === item.product_id &&
          m.variant_id === item.variant_id
      );

      const minimum = Math.max(
        1,
        Number(setting?.minimum_qty || 1)
      );

      if(Number(item.qty) < minimum){
        throw new Error(
          item.product_name + " " + item.strength +
          " requires a minimum of " + minimum + " pc."
        );
      }
    }

    const email = $("email").value.trim().toLowerCase();

    if(!email){
      alert("Enter email.");
      return;
    }

    const {data: customer, error: customerError} = await sb
      .from("customers")
      .upsert({
        email,
        customer_name: $("customerName").value.trim(),
        contact: $("contact").value.trim(),
        address: $("address").value.trim()
      }, {onConflict:"email"})
      .select()
      .single();

    if(customerError) throw customerError;

    const total = cart.reduce(
      (sum,item) =>
        sum + Number(item.price) * Number(item.qty),
      0
    );

    const {data: order, error: orderError} = await sb
      .from("orders")
      .insert({
        gb_number: currentGB.gb_number,
        customer_id: customer.customer_id,
        email,
        total,
        payment_status:"PENDING",
        shipping_method:$("shippingMethod").value.trim(),
        shipping_fee:0
      })
      .select()
      .single();

    if(orderError) throw orderError;

    const rows = cart.map(item => ({
      order_id:order.order_id,
      product_id:item.product_id,
      variant_id:item.variant_id,
      product_name:item.product_name,
      strength:item.strength,
      qty:Number(item.qty),
      unit_price:Number(item.price),
      line_total:Number(item.price) * Number(item.qty)
    }));

    const {error:itemError} = await sb
      .from("order_items")
      .insert(rows);

    if(itemError) throw itemError;

    $("checkoutMsg").className = "notice success";
    $("checkoutMsg").textContent =
      "Order submitted: " + order.order_id +
      ". Please follow the payment instructions from PEPMOSA.";

    cart = [];
    localStorage.removeItem("pepmosaCart");
    updateCart();

  }catch(error){
    console.error(error);
    $("checkoutMsg").className = "notice error";
    $("checkoutMsg").textContent =
      error.message || "Unable to submit order.";
  }
}

load();
</script>
</body>
</html>
