<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PEPMOSA • Track</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html"><span class="logoMark">P</span>PEPMOSA</a><nav class="nav"><a href="index.html">HOME</a><a href="calculator.html">CALCULATOR</a><a href="protocols.html">PROTOCOLS</a><a href="track.html">TRACK</a><a href="coa.html">COA</a></nav></header><main class="wrap"><section class="hero"><div><div class="eyebrow">ORDER TRACKING</div><h1>Track Your Order</h1><p class="muted">Enter the email used with your order.</p></div></section><section class="card" style="margin-top:16px"><input id="email" class="input" placeholder="Email"><div class="actions"><button class="btn primary" onclick="track()">TRACK ORDER</button></div><div id="out"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>initSupabase();async function track(){let e=document.getElementById('email').value.trim().toLowerCase();if(!e)return;let r=await sb.from('orders').select('*').eq('email',e).order('created_at',{ascending:false});document.getElementById('out').innerHTML=r.error?'<div class="notice error">'+esc(r.error.message)+'</div>':(r.data||[]).map(o=>'<div class="card" style="margin-top:10px"><div class="row"><b>'+esc(o.order_id)+'</b><span class="status pending">'+esc(o.payment_status)+'</span></div><div class="row"><span>GB</span><b>'+esc(o.gb_number)+'</b></div><div class="row"><span>Total</span><b>'+peso(o.total)+'</b></div></div>').join('')||'<div class="notice">No orders found.</div>'}</script></body></html>
